<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendbook Lite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #333; display: flex; justify-content: center; height: 100vh; overflow: hidden; }

        .app-container {
            width: 100%; max-width: 480px; background: #fff; height: 100vh;
            display: flex; flex-direction: column; box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        /* Authentication Screen */
        .auth-screen { padding: 25px; display: flex; flex-direction: column; justify-content: center; height: 100%; text-align: center; background: #fff; }
        .auth-screen h1 { color: #1877f2; margin-bottom: 5px; font-size: 36px; font-weight: 800; }
        .auth-screen p { color: #65676b; margin-bottom: 25px; font-size: 14px; }
        .auth-screen input { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #f5f6f7; outline: none; }
        .btn-main { background: #1877f2; color: #fff; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; }
        .auth-toggle { margin-top: 18px; color: #1877f2; cursor: pointer; font-size: 14px; font-weight: 600; }

        /* Main App Interface */
        .main-app { display: none; flex-direction: column; height: 100%; }

        /* Facebook Lite Header Navigation */
        .top-nav { background: #1877f2; color: white; display: flex; justify-content: space-around; align-items: center; height: 50px; }
        .top-nav div { position: relative; font-size: 20px; cursor: pointer; padding: 10px; flex: 1; text-align: center; opacity: 0.7; }
        .top-nav div.active { opacity: 1; border-bottom: 3px solid #fff; }
        .badge { position: absolute; top: 5px; right: 20%; background: #fa3e3e; color: white; font-size: 10px; border-radius: 50%; padding: 2px 6px; font-weight: bold; }

        /* Content Views */
        .content-area { flex: 1; overflow-y: auto; background: #f0f2f5; }
        .tab-view { display: none; padding: 10px; }
        .tab-view.active { display: block; }

        /* Post Card Style */
        .create-post { background: #fff; padding: 12px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .create-post textarea { width: 100%; border: none; resize: none; outline: none; font-size: 15px; }
        .post-card { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .post-header { display: flex; align-items: center; margin-bottom: 8px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #1877f2; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 10px; font-size: 18px; }
        .post-author { font-weight: bold; font-size: 14px; }
        .post-actions { display: flex; justify-content: space-around; border-top: 1px solid #eee; padding-top: 8px; margin-top: 8px; font-size: 13px; color: #606770; }
        .post-actions div { cursor: pointer; }

        /* Chat Item Style */
        .chat-item { background: #fff; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .chat-info { display: flex; align-items: center; }

        /* Call Modal Overlay */
        .call-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; color: #fff; text-align: center; flex-direction: column; justify-content: center; align-items: center; }
        .video-box { width: 90%; height: 250px; background: #222; margin: 15px 0; border-radius: 12px; overflow: hidden; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="app-container">
    
    <div id="authScreen" class="auth-screen">
        <h1>Friendbook</h1>
        <p>সবার সাথে যুক্ত থাকুন সহজ উপায়ে</p>

        <div id="registerForm">
            <input type="text" id="regName" placeholder="আপনার পূর্ণ নাম">
            <input type="date" id="regDob">
            <input type="email" id="regEmail" placeholder="জিমেইল এড্রেস">
            <input type="password" id="regPass" placeholder="নতুন পাসওয়ার্ড">
            <button class="btn-main" onclick="handleRegister()">একাউন্ট খুলুন</button>
            <div class="auth-toggle" onclick="toggleAuth(false)">ইতোমধ্যে একাউন্ট আছে? লগইন করুন</div>
        </div>

        <div id="loginForm" style="display: none;">
            <input type="email" id="loginEmail" placeholder="জিমেইল এড্রেস">
            <input type="password" id="loginPass" placeholder="পাসওয়ার্ড">
            <button class="btn-main" onclick="handleLogin()">লগইন করুন</button>
            <div class="auth-toggle" onclick="toggleAuth(true)">নতুন একাউন্ট খুলতে চান? রেজিস্টার করুন</div>
        </div>
    </div>

    <div id="mainApp" class="main-app">
        
        <div class="top-nav">
            <div class="active" onclick="switchTab('feedView', this)"><i class="fa-solid fa-house"></i></div>
            <div onclick="switchTab('msgView', this)"><i class="fa-solid fa-message"></i><span class="badge">1</span></div>
            <div onclick="switchTab('notifView', this)"><i class="fa-solid fa-bell"></i></div>
            <div onclick="switchTab('menuView', this)"><i class="fa-solid fa-bars"></i></div>
        </div>

        <div class="content-area">
            
            <div id="feedView" class="tab-view active">
                <div class="create-post">
                    <textarea id="postContent" rows="2" placeholder="আপনার মনে কি আছে?"></textarea>
                    <button class="btn-main" style="padding: 6px; font-size: 13px;" onclick="publishPost()">পোস্ট করুন</button>
                </div>
                <div id="feedList">
                    </div>
            </div>

            <div id="msgView" class="tab-view">
                <button class="btn-main" style="margin-bottom: 10px; background: #42b72a;" onclick="createGroup()">+ নতুন গ্রুপ চ্যাট তৈরি করুন</button>
                <div id="chatList">
                    </div>
            </div>

            <div id="notifView" class="tab-view">
                <div class="chat-item">
                    <div><b>Friendbook Team</b> আপনাকে স্বাগতম জানাচ্ছে!</div>
                </div>
            </div>

            <div id="menuView" class="tab-view">
                <div style="background: #fff; padding: 20px; border-radius: 8px; text-align: center;">
                    <div id="profileAvatar" class="user-avatar" style="width: 60px; height: 60px; margin: 0 auto 10px; font-size: 24px;">U</div>
                    <h3 id="profileName">ইউজার নেম</h3>
                    <p id="profileEmail" style="color: #666; font-size: 13px; margin-top: 4px;"></p>
                    <button class="btn-main" style="background: #fa3e3e; margin-top: 20px;" onclick="handleLogout()">লগআউট</button>
                </div>
            </div>

        </div>
    </div>

    <div id="callModal" class="call-modal">
        <h3 id="callerTitle">কল হচ্ছে...</h3>
        <div class="video-box">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted style="width: 80px; height: 100px; position: absolute; bottom: 10px; right: 10px; border: 2px solid #fff;"></video>
        </div>
        <div>
            <button class="btn-main" style="background: #42b72a; width: 100px; display: inline-block;" onclick="answerCall()">রিসিভ</button>
            <button class="btn-main" style="background: #fa3e3e; width: 100px; display: inline-block;" onclick="endCall()">কাটুন</button>
        </div>
    </div>

</div>

<script>
    // --- YOUR EXACT FIREBASE CONFIGURATION ---
    const firebaseConfig = {
        apiKey: "AIzaSyDU65a9yrGbvyynOE5w1BS8Owpo-...", // Your API Key linked
        authDomain: "friendbook-a5cb3.firebaseapp.com",
        projectId: "friendbook-a5cb3",
        storageBucket: "friendbook-a5cb3.firebasestorage.app",
        messagingSenderId: "616280900247",
        appId: "1:616280900247:web:f72797b5ee901a...",
        measurementId: "G-YN5F994ZMX",
        databaseURL: "https://friendbook-a5cb3-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // AUTH TOGGLE
    function toggleAuth(showRegister) {
        document.getElementById('registerForm').style.display = showRegister ? 'block' : 'none';
        document.getElementById('loginForm').style.display = showRegister ? 'none' : 'block';
    }

    // REGISTER USER & SEND VERIFICATION EMAIL
    function handleRegister() {
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const pass = document.getElementById('regPass').value;
        const dob = document.getElementById('regDob').value;

        if(!name || !email || !pass) return alert("সবগুলো তথ্য সঠিকভাবে প্রদান করুন!");

        auth.createUserWithEmailAndPassword(email, pass).then((userCredential) => {
            const user = userCredential.user;
            
            user.sendEmailVerification().then(() => {
                alert("আপনার জিমেইলে একটি কনফার্মেশন কোড/লিঙ্ক পাঠানো হয়েছে। দয়া করে ইমেইল ভেরিফাই করুন!");
            });

            db.ref('users/' + user.uid).set({
                name: name,
                email: email,
                dob: dob
            });

            auth.signOut();
            toggleAuth(false);
        }).catch(err => alert(err.message));
    }

    // LOGIN USER
    function handleLogin() {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPass').value;

        auth.signInWithEmailAndPassword(email, pass).then((res) => {
            if(!res.user.emailVerified) {
                alert("আপনার জিমেইল ভেরিফাই করা হয়নি! ইমেইল ইনবক্স চেক করে লিঙ্ক বা কোডে ক্লিক করুন।");
                auth.signOut();
            }
        }).catch(err => alert(err.message));
    }

    // MONITOR LOGIN STATUS
    auth.onAuthStateChanged((user) => {
        if (user && user.emailVerified) {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            
            db.ref('users/' + user.uid).once('value', snap => {
                const userData = snap.val();
                if(userData) {
                    document.getElementById('profileName').innerText = userData.name;
                    document.getElementById('profileEmail').innerText = userData.email;
                    document.getElementById('profileAvatar').innerText = userData.name.charAt(0).toUpperCase();
                }
            });
            loadFeed();
            loadChats();
        } else {
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
        }
    });

    function handleLogout() { auth.signOut(); }

    // TAB NAVIGATION
    function switchTab(tabId, el) {
        document.querySelectorAll('.tab-view').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.top-nav div').forEach(nav => nav.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        el.classList.add('active');
    }

    // POST SYSTEM
    function publishPost() {
        const text = document.getElementById('postContent').value;
        const user = auth.currentUser;
        if(!text) return;

        db.ref('users/' + user.uid).once('value', snap => {
            const userName = snap.val() ? snap.val().name : "User";
            db.ref('posts').push({
                uid: user.uid,
                author: userName,
                content: text,
                likes: 0,
                timestamp: Date.now()
            });
            document.getElementById('postContent').value = '';
        });
    }

    function loadFeed() {
        db.ref('posts').on('value', snapshot => {
            const feedList = document.getElementById('feedList');
            feedList.innerHTML = '';
            const data = snapshot.val();
            if(data) {
                Object.keys(data).reverse().forEach(key => {
                    const post = data[key];
                    feedList.innerHTML += `
                        <div class="post-card">
                            <div class="post-header">
                                <div class="user-avatar">${post.author.charAt(0).toUpperCase()}</div>
                                <div class="post-author">${post.author}</div>
                            </div>
                            <div style="font-size: 14px; margin-bottom: 8px; color: #1c1e21;">${post.content}</div>
                            <div class="post-actions">
                                <div onclick="likePost('${key}', ${post.likes || 0})"><i class="fa-regular fa-thumbs-up"></i> ${post.likes || 0} Like</div>
                                <div><i class="fa-regular fa-comment"></i> Comment</div>
                            </div>
                        </div>
                    `;
                });
            }
        });
    }

    function likePost(postId, currentLikes) {
        db.ref('posts/' + postId).update({ likes: currentLikes + 1 });
    }

    // CHAT SYSTEM
    function loadChats() {
        const chatList = document.getElementById('chatList');
        chatList.innerHTML = `
            <div class="chat-item">
                <div class="chat-info">
                    <div class="user-avatar" style="background:#42b72a;">G</div>
                    <div>
                        <b>Global Community Chat</b>
                        <div style="font-size:12px; color:#666;">সবাই একসাথে কথা বলুন</div>
                    </div>
                </div>
                <div>
                    <i class="fa-solid fa-phone" onclick="startCall('audio')" style="margin-right:15px; color:#1877f2;"></i>
                    <i class="fa-solid fa-video" onclick="startCall('video')" style="color:#1877f2;"></i>
                </div>
            </div>
        `;
    }

    function createGroup() {
        const groupName = prompt("নতুন গ্রুপের নাম লিখুন:");
        if(groupName) alert(`"${groupName}" গ্রুপ তৈরি হয়েছে!`);
    }

    // CALL SYSTEM (AUDIO / VIDEO)
    let localStream;
    function startCall(type) {
        document.getElementById('callModal').style.display = 'flex';
        document.getElementById('callerTitle').innerText = (type === 'video' ? 'ভিডিও' : 'অডিও') + " কল হচ্ছে...";
        navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true })
            .then(stream => {
                localStream = stream;
                document.getElementById('localVideo').srcObject = stream;
            }).catch(err => alert("ক্যামেরা/মাইক্রোফোন অ্যাক্সেস পাওয়া যায়নি!"));
    }

    function answerCall() { document.getElementById('callerTitle').innerText = "সংযুক্ত হয়েছে"; }
    function endCall() {
        if(localStream) localStream.getTracks().forEach(track => track.stop());
        document.getElementById('callModal').style.display = 'none';
    }
</script>

</body>
</html>
